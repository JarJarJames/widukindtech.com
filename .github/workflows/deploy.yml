name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # pick up new BEER announcements every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build BEER updates page from GitHub Discussions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_updates.py

      - name: Collect site files
        run: |
          mkdir _site
          rsync -a --exclude '.git*' --exclude '.github' --exclude 'scripts' \
            --exclude 'templates' --exclude '_site' ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
